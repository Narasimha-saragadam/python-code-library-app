---
services:
   db:
    image: narasimhasaragadam/python:db
    deploy:
      replicas: 1
    ports:
      - "3306:3306"
    volumes:
     - mydata:/var/lib/mysql/
    networks:
      - mynetwork
      
  auth_service:
    image: narasimhasaragadam/python:auth
    deploy:
      replicas: 1
    ports:
      - "5001:5001"
    networks:
      - mynetwork
    depends_on:
      - db

 book_service:
    image: narasimhasaragadam/python:book
    deploy:
      replicas: 1
    ports:
      - "5002:5002"
    networks:
      - mynetwork
    depends_on:
      - db

  borrow_service:
    image: narasimhasaragadam/python:borrow
    deploy:
      replicas: 1
    ports:
      - "5003:5003"
    networks:
      - mynetwork
    depends_on:
      - db

  frontend:
    image: narasimhasaragadam/python:application
    deploy:
      replicas: 1
    ports:
       - "5000:5000"
    networks:
      - mynetwork
    depends_on:
      - auth_service
      - book_service
      - borrow_service

networks:
  mynetwork:
    driver: overlay
volumes:
  mydata:
